    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#030305" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e8c15a' stroke-width='2'/%3E%3Ccircle cx='20.5' cy='11.5' r='3.4' fill='none' stroke='%235ab0e8' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Golden Ratio WebGPU Fractal Engine</title>
    <meta name="description" content="High-performance WebGPU and WebGL2 real-time 3D fractal raymarching engine based on golden ratio φ, prime distributions, TPMS surfaces, and mathematical hybrids." />
    <meta property="og:title" content="Golden Ratio WebGPU Fractal Engine" />
    <meta property="og:description" content="High-performance WebGPU and WebGL2 real-time 3D fractal raymarching engine based on golden ratio φ, prime distributions, TPMS surfaces, and mathematical hybrids." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <style>
      /* Pre-paint splash (Perf #1, PERF_AUDIT-2026-09-23): renders immediately from
         HTML+CSS alone, decoupling FCP from 5 s of JS parse+exec. React removes it
         after first commit. Uses the same golden-ratio ring motif as the favicon. */
      #pre-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#030305;transition:opacity .4s ease-out}
      #pre-splash.dismiss{opacity:0;pointer-events:none}
      #pre-splash svg{width:64px;height:64px;animation:splash-spin 3s linear infinite}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){#pre-splash svg{animation:none}}
    </style>
    <div id="pre-splash" aria-label="Loading fractal engine" role="status">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="13" stroke="#e8c15a" stroke-width="1.5" opacity=".8"/>
        <circle cx="20.5" cy="11.5" r="5" stroke="#5ab0e8" stroke-width="1.2" opacity=".6"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
