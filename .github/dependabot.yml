version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    reviewers:
      - bouncemonster
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Collapse routine minor/patch bumps into a single PR per week.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # React 19 and Tailwind v4 are load-bearing decisions; keep major bumps as
      # dedicated PRs so they get their own review.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
